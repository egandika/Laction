name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all modules
        run: python -m compileall -q laction_agent tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Doctor (health check)
        run: python -m laction_agent doctor

      - name: Editable install
        run: python -m pip install -e .

      - name: CLI smoke test (entry point)
        run: |
          laction --version
          laction tools --json | python -c 'import json,sys; assert len(json.load(sys.stdin)) >= 30'
          laction "list skill" | grep -q "code-review"
          laction status --json | python -c 'import json,sys; assert json.load(sys.stdin)["config"]["provider"] == "mock"'

      - name: Gateway smoke test
        run: |
          python -m laction_agent gateway --host 127.0.0.1 --port 8123 --no-cron > /tmp/laction-gateway.log 2>&1 &
          gw_pid=$!
          trap 'kill "$gw_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/health > /tmp/laction-health.json; then break; fi
            sleep 1
          done
          python -c 'import json; d=json.load(open("/tmp/laction-health.json")); assert d["ok"] and d["tools"] >= 30, d'
          curl -fsS -X POST http://127.0.0.1:8123/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"ingat: CI berjalan","session_id":"s-ci"}' \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert "Tersimpan" in d["reply"], d'
